[Login]
# The graphical sessions own the power key: Game Mode runs armada-powerbuttond
# and KDE runs PowerDevil, both with a display-only short press. logind must not
# also suspend on that key.
HandlePowerKey=ignore
HandleSuspendKey=suspend
HandleHibernateKey=ignore
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore

# The reboot wall paints over the shutdown splash; config reloads reset the
# runtime property, so it must be pinned here.
WallMessages=no
