name: "问题反馈 / Bug report"
description: "报告使用问题。Report a problem."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: hardware
    attributes:
      label: 设备 / Hardware Device
      description: 填写使用的设备型号。Enter your device model.
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: 系统版本 / OS version
      description: 填写版本号或镜像文件名及来源。Version or image filename and source.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Problem
      description: 说明问题和复现步骤，可附截图或日志。Describe the problem and steps to reproduce; attach screenshots or logs if available.
    validations:
      required: true

  - type: input
    id: ai-disclosure
    attributes:
      label: AI 使用情况 / AI usage
      description: 工具＋模型名称；未使用填“未使用”。Tool + model name, or None.
    validations:
      required: true
